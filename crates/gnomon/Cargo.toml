[package]
name = "gnomon"
version = "0.0.0"
description = "A bi-temporal knowledge graph for agentic AI systems, stored in plain Postgres."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Builds the on-demand performance suite, tests/performance.rs. Off by
# default, so a plain `cargo test` or `cargo nextest run` never builds or runs
# it (ADR-0020, docs/testing.md).
performance = []

[[test]]
name = "performance"
path = "tests/performance.rs"
required-features = ["performance"]

[dependencies]
bytes = "1"
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
postgres-protocol = "0.6.12"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", features = ["aws-lc-rs"] }
uuid = "1"

[dev-dependencies]
serde_json = "1"
proptest = "1"
tempfile = "3"
testcontainers = { version = "0.28", default-features = false, features = ["aws-lc-rs", "reusable-containers"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
tokio-postgres = "0.7.18"
uuid = { version = "1", features = ["v4"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
