[package]
name = "gnomon"
version = "0.0.0"
description = "A bi-temporal knowledge graph for agentic AI systems, stored in plain Postgres."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "gnomon"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14"
uuid = "1"

[dev-dependencies]
chrono = "0.4"
serde_json = "1"
proptest = "1"
tempfile = "3"
testcontainers = { version = "0.28", features = ["reusable-containers"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
tokio-postgres = "0.7.18"
uuid = { version = "1", features = ["v4"] }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
