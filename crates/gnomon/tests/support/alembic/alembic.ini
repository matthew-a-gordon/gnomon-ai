# A consumer's Alembic project, as the alembic target's tests use it. The
# revisions live in `versions/`, where the tests export gnomon's migrations.
# env.py reads the database URL from GNOMON_ALEMBIC_URL.
[alembic]
script_location = %(here)s
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
