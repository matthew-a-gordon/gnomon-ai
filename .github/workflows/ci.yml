# What runs here and when is recorded in ADR-0020. The three job names are the
# required status checks of the ruleset on main, so renaming a job also means
# changing the ruleset.
#
# No push trigger: the ruleset requires an up-to-date branch, so the pull request
# run tests what lands on main. No cache: each run builds from nothing.
#
# This repository is public. The token only reads, the workflow uses no secret,
# the trigger is pull_request and never pull_request_target, and every
# third-party action is pinned to a commit SHA.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0" # the test profile inherits it
  NEXTEST_VERSION: "0.9.152"
  NEXTEST_SHA256: d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a
  UV_VERSION: "0.13.7"

jobs:
  test-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps: &test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-nextest
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/nextest.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin"

      - name: Install uv, for uvx
        run: pipx install "uv==$UV_VERSION"

      # The harness would fetch these inside the first tests that need them, and
      # that time would count against those tests' limits. Several tests run npx
      # at once, which is also unsafe while the package is not yet installed.
      - name: Fetch the Supabase CLI
        run: |
          cli=$(sed -n 's/^pub const SUPABASE_CLI: &str = "\(.*\)";$/\1/p' crates/gnomon/tests/support/mod.rs)
          test -n "$cli"
          npx --yes "$cli" --version

      - name: Pull the test database image
        run: docker pull "$TEST_IMAGE_REF"

      - run: cargo nextest run --workspace

    env:
      GNOMON_TEST_IMAGE: pgvector
      # The image tests/support/server.rs names for GNOMON_TEST_IMAGE.
      TEST_IMAGE_REF: pgvector/pgvector:pg17

  test-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps: *test-steps
    env:
      GNOMON_TEST_IMAGE: supabase
      TEST_IMAGE_REF: public.ecr.aws/supabase/postgres:17.12.0.000

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
