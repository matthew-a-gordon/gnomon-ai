# The rules `cargo deny` checks (ADR-0020). The lint job runs `check bans
# licenses sources`, which depends only on Cargo.lock and this file. The
# advisories jobs run `check advisories`, whose database changes daily.

[graph]
# So a banned crate behind an optional feature is seen. No targets are named, so
# every target is checked.
all-features = true

[bans]
multiple-versions = "warn"
# Dev-dependencies are in the graph too.
deny = [
  { crate = "ring", reason = "aws-lc-rs is the one crypto provider (ADR-0021)" },
  { crate = "openssl-sys", reason = "TLS goes through rustls and aws-lc-rs (ADR-0021)" },
  { crate = "native-tls", reason = "TLS goes through rustls and aws-lc-rs (ADR-0021)" },
]

[licenses]
# gnomon ships its dependencies inside its artifacts under Apache-2.0. Any
# licence not listed here needs an entry in `exceptions` that names one crate,
# with a comment giving the reason.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "OpenSSL", # for aws-lc-sys, whose 0.47.0 expression does not name it
]
exceptions = []
include-dev = true
# Some licences above are allowed before any crate uses them.
unused-allowed-license = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
# Every crate counts, not only the ones this workspace names. The default scope
# differs between cargo-deny versions and kinds of advisory, so both are stated.
unmaintained = "all"
unsound = "all"
ignore = []
